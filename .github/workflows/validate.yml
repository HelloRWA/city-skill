name: validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run unit and security fixture tests
        run: npm test
      - name: Validate repository and build registry
        run: npm run build:registry
        env:
          CITY_SKILL_COMMIT: ${{ github.sha }}
      - name: Upload registry preview
        uses: actions/upload-artifact@v4
        with:
          name: city-skill-registry-${{ github.sha }}
          path: registry.json
          if-no-files-found: error
          retention-days: 14
